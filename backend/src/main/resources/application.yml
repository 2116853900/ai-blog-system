server:
  port: 8080
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}

spring:
  application:
    name: ai-blog-backend
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  datasource:
    url: jdbc:mysql://localhost:3306/ai_blog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME_MS:1800000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT_MS:2000}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# 应用自定义配置
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-string-at-least-32-bytes-long}
    expiration-ms: 86400000   # 24h
  admin:
    # 启动时若库中无管理员则用此账号创建（首次登录后请尽快修改）
    default-username: ${ADMIN_USERNAME:admin}
    default-password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175
  status-check:
    enabled: true
    # 每 10 分钟探测一次公益 API 站点
    cron: "0 */10 * * * *"
    timeout-ms: 8000
    max-concurrency: ${STATUS_CHECK_MAX_CONCURRENCY:8}
  admin-dashboard:
    cache-ttl-ms: ${ADMIN_DASHBOARD_CACHE_TTL_MS:5000}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    redis-enabled: ${APP_CACHE_REDIS_ENABLED:false}
    key-prefix: ${APP_CACHE_KEY_PREFIX:ai-blog}
    local-max-size: ${APP_CACHE_LOCAL_MAX_SIZE:1000}
    public-content-ttl-ms: ${APP_CACHE_PUBLIC_CONTENT_TTL_MS:30000}
    search-ttl-ms: ${APP_CACHE_SEARCH_TTL_MS:10000}
  forum:
    view-buffer:
      enabled: ${FORUM_VIEW_BUFFER_ENABLED:true}
      redis-enabled: ${FORUM_VIEW_BUFFER_REDIS_ENABLED:false}
      redis-key: ${FORUM_VIEW_BUFFER_REDIS_KEY:ai-blog:forum:view-count-delta}
      flush-interval-ms: ${FORUM_VIEW_BUFFER_FLUSH_INTERVAL_MS:5000}
      max-batch-size: ${FORUM_VIEW_BUFFER_MAX_BATCH_SIZE:500}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    storage: ${RATE_LIMIT_STORAGE:local}
    redis-key-prefix: ${RATE_LIMIT_REDIS_KEY_PREFIX:ai-blog:rate-limit}
    cleanup-interval-ms: ${RATE_LIMIT_CLEANUP_INTERVAL_MS:60000}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:5}
      refill-period-ms: ${RATE_LIMIT_AUTH_REFILL_PERIOD_MS:60000}
    public-mutation:
      capacity: ${RATE_LIMIT_PUBLIC_MUTATION_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_PUBLIC_MUTATION_REFILL_TOKENS:10}
      refill-period-ms: ${RATE_LIMIT_PUBLIC_MUTATION_REFILL_PERIOD_MS:60000}
    forum-mutation:
      capacity: ${RATE_LIMIT_FORUM_MUTATION_CAPACITY:30}
      refill-tokens: ${RATE_LIMIT_FORUM_MUTATION_REFILL_TOKENS:30}
      refill-period-ms: ${RATE_LIMIT_FORUM_MUTATION_REFILL_PERIOD_MS:60000}
    account-mutation:
      capacity: ${RATE_LIMIT_ACCOUNT_MUTATION_CAPACITY:60}
      refill-tokens: ${RATE_LIMIT_ACCOUNT_MUTATION_REFILL_TOKENS:60}
      refill-period-ms: ${RATE_LIMIT_ACCOUNT_MUTATION_REFILL_PERIOD_MS:60000}

logging:
  level:
    com.aiblog: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
